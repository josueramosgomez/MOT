<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Quiz Topografía</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#17212b;--mut:#6a7787;--bd:#e3e8ee;--ac:#0f766e;--ac2:#14b8a6;--acbg:#e6f5f3;
--good:#15803d;--goodbg:#dcfce7;--mid:#b45309;--midbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e141a;--card:#161e27;--tx:#e6ecf2;--mut:#8b99a8;--bd:#263240;--ac:#2dd4bf;--ac2:#14b8a6;--acbg:#12302d;
--good:#4ade80;--goodbg:#12331f;--mid:#fbbf24;--midbg:#3a2d0c;--bad:#f87171;--badbg:#3b1717;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;min-height:100%}
aside{width:224px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 18px}
.logo{white-space:nowrap;padding-left:6px}.logo img{width:36px;height:36px;object-fit:contain;flex:none;margin-right:-2px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--mut);font-weight:600;text-align:left;width:100%}
.nav:hover{background:var(--bg);color:var(--tx)}.nav.on{background:var(--acbg);color:var(--ac)}
.side-foot{margin-top:auto;font-size:12px;color:var(--mut);padding:10px}
main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1180px}
body.focus aside{display:none}body.focus main{margin:0 auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:16px;margin:0 0 14px}.sub{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:3fr 2fr}
@media(max-width:980px){.g2{grid-template-columns:1fr}aside{display:none}main{padding:20px}}
.mt{margin-top:16px}
.kpi .kl{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .kv{font-size:30px;font-weight:700;margin:2px 0}.kpi .ks{color:var(--mut);font-size:12px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
body.dk .btn.pri{color:#04201c}.btn.pri:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:13px 26px;font-size:16px;border-radius:12px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--mut)}
.chip:hover{border-color:var(--ac)}.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.chip small{opacity:.7;font-weight:500}.chip:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{flex:1}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;background:var(--bg);color:var(--mut)}
.good{color:var(--good)}.mid{color:var(--mid)}.bad{color:var(--bad)}
.badge.good{background:var(--goodbg)}.badge.mid{background:var(--midbg)}.badge.bad{background:var(--badbg)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--ac2)}
.bar.good>i{background:var(--good)}.bar.mid>i{background:var(--mid)}.bar.bad>i{background:var(--bad)}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}
td{padding:11px 10px;border-bottom:1px solid var(--bd)}tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:8px;border:1px dashed var(--bd);background:none;font-size:12px;font-weight:700;color:var(--mut);display:grid;place-items:center}
.tile.has{border:1px solid var(--bd);background:var(--bg)}.tile.good{background:var(--goodbg);border-color:transparent;color:var(--good)}
.tile.mid{background:var(--midbg);border-color:transparent;color:var(--mid)}.tile.bad{background:var(--badbg);border-color:transparent;color:var(--bad)}
.tile.has:hover{outline:2px solid var(--ac)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:12px;flex-wrap:wrap}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.opt-type{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.type{text-align:left;border:2px solid var(--bd);background:var(--card);border-radius:14px;padding:16px}
.type:hover{border-color:var(--ac2)}.type.on{border-color:var(--ac);background:var(--acbg)}.type:disabled{opacity:.45;cursor:not-allowed}
.type b{display:block;margin-bottom:2px}.type span{color:var(--mut);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 16px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--ac);color:#fff}
body.dk .seg button.on{color:#04201c}
label.lb{display:block;font-weight:700;margin:22px 0 8px}
input[type=number]{width:90px;padding:7px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
/* quiz */
.qtop{display:flex;align-items:center;gap:16px;margin-bottom:16px}.qtop .bar{flex:1;height:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.qlayout{display:grid;grid-template-columns:1fr 230px;gap:18px;align-items:start}
@media(max-width:900px){.qlayout{grid-template-columns:1fr}}
.qtext{font-size:19px;font-weight:600;line-height:1.45;margin:10px 0 20px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.opt:hover:not(:disabled){border-color:var(--ac2)}.opt .l{flex:none;width:28px;height:28px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--ac);background:var(--acbg)}.opt.sel .l{background:var(--ac);color:#fff}
.opt.ok{border-color:var(--good);background:var(--goodbg)}.opt.ok .l{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--badbg)}.opt.ko .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}.opt.dim{opacity:.55}
.expl{background:var(--acbg);border-radius:12px;padding:13px 16px;margin-top:6px;font-size:14px}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.navgrid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:12px;font-weight:600;color:var(--mut)}
.navgrid .ans{background:var(--acbg);color:var(--ac);border-color:var(--ac2)}.navgrid .ok{background:var(--goodbg);color:var(--good);border-color:transparent}
.navgrid .ko{background:var(--badbg);color:var(--bad);border-color:transparent}.navgrid .cur{outline:2px solid var(--tx)}
.kbd{font-size:12px;color:var(--mut);margin-top:12px}kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;background:var(--card)}
/* resultado */
.hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.score{font-size:56px;font-weight:800;line-height:1}.score small{font-size:20px;color:var(--mut);font-weight:600}
.tag{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:800;font-size:13px}
.tag.good{background:var(--goodbg);color:var(--good)}.tag.bad{background:var(--badbg);color:var(--bad)}
.rev{border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--card)}
.rev.ko{border-left:5px solid var(--bad)}.rev.ok{border-left:5px solid var(--good)}.rev.bl{border-left:5px solid var(--mid)}
.rev .o{padding:5px 10px;border-radius:8px;margin-top:5px;font-size:14px}.rev .o.c{background:var(--goodbg);color:var(--good);font-weight:600}.rev .o.w{background:var(--badbg);color:var(--bad);font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:10px;font-weight:600;z-index:9}
svg text{fill:var(--mut);font-size:11px}
@media(max-width:980px){aside{display:flex;flex-direction:row;position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;z-index:8;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;border-right:0;border-top:1px solid var(--bd)}
aside .logo,aside .side-foot{display:none}aside .nav{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:11px;text-align:center;justify-content:center}
main{padding:16px 14px calc(86px + env(safe-area-inset-bottom))}body.focus main{padding-bottom:40px}main table{display:block;overflow-x:auto}}
/* ===== color (v2) ===== */
aside{background:linear-gradient(180deg,var(--card) 55%,color-mix(in srgb,#7c3aed 7%,var(--card)))}
.nav.on{background:linear-gradient(90deg,color-mix(in srgb,#7c3aed 16%,transparent),color-mix(in srgb,#0d9488 12%,transparent));color:var(--tx)}
.btn.pri{background:linear-gradient(135deg,#0f766e,#14b8a6);border-color:#0f766e}
h1{letter-spacing:-.01em}
.kpi{position:relative;overflow:hidden;border-top:4px solid var(--c,#0d9488);background:linear-gradient(160deg,color-mix(in srgb,var(--c,#0d9488) 10%,var(--card)),var(--card) 65%)}
.kpi .ki{position:absolute;right:14px;top:12px;font-size:22px}
.tile.has.good{background:var(--goodbg);border-color:var(--good);color:var(--good)}.tile.has.mid{background:var(--midbg);border-color:var(--mid);color:var(--mid)}.tile.has.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.kpi .kl{padding-right:30px}
.bar.bq>i{background:var(--c)}.bq{color:var(--c)}
.tgrp{margin-bottom:12px}.tgrp>small{display:block;font-weight:800;color:var(--c);margin-bottom:6px;font-size:12px}
.tile.has{border-color:color-mix(in srgb,var(--c) 55%,var(--bd));background:color-mix(in srgb,var(--c) 8%,var(--card));color:var(--c)}
.type{border-top:5px solid var(--c)}.type b{color:var(--c);font-size:16px}.type .em{font-size:24px;display:block;margin-bottom:4px}
.type.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card))}.type:hover{border-color:var(--c)}
.chip.on.bqc{background:color-mix(in srgb,var(--c) 15%,var(--card));border-color:var(--c);color:var(--c)}
.badge.tb{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.qtop .bar>i{background:linear-gradient(90deg,#7c3aed,#14b8a6)}
.expl{background:color-mix(in srgb,#0d9488 10%,var(--card));border-left:4px solid #0d9488}
.expl .truco{display:block;margin-top:9px;background:color-mix(in srgb,#f59e0b 16%,var(--card));border-left:4px solid #f59e0b;border-radius:8px;padding:8px 12px;font-weight:600}
.expl .amp{display:inline-block;background:color-mix(in srgb,#64748b 18%,transparent);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:4px}
.fire{background:linear-gradient(90deg,#f59e0b,#dc2626);color:#fff;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.opt.ok{animation:pop .35s}@keyframes pop{50%{transform:scale(1.015)}}
.meter{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#fecaca 0 50%,#fde68a 50% 60%,#bbf7d0 60%);margin:26px 0 30px}
body.dk .meter{background:linear-gradient(90deg,#4c1d1d 0 50%,#4a3a0c 50% 60%,#12331f 60%)}
.meter .mk{position:absolute;top:-4px;width:6px;height:22px;border-radius:3px;background:var(--tx);transform:translateX(-50%)}
.meter .tk{position:absolute;top:20px;font-size:11px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
.meter .tk.up{top:-20px}
.hero .score{background:linear-gradient(135deg,var(--sc1),var(--sc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rev.ok{border-left-color:#16a34a}.rev{border-left-width:5px}
.prep{display:grid;gap:4px;margin-top:12px}.prow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.prow .ks{color:var(--mut);font-size:12px}.dbar{display:flex;align-items:center;gap:8px}.dbar .bar{height:10px}
@media(max-width:760px){.prow{grid-template-columns:1fr}}
.tile.tl2{position:relative;overflow:hidden}.tile .sbar{position:absolute;left:0;bottom:0;height:5px;background:#7c3aed;border-radius:0 3px 0 0}
.tile.st:not(.has){border-style:solid;border-color:#7c3aed66;color:#7c3aed}.tile .ck2{position:absolute;top:1px;right:3px;font-size:9px;color:#7c3aed}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img src="icon-192.png" alt="">Quiz Topografía</div>
    <button class="nav" data-v="panel" onclick="go('panel')">📊&nbsp; Panel</button>
    <button class="nav" data-v="estudio" onclick="go('estudio')">🧠&nbsp; Estudiar</button>
    <button class="nav" data-v="nuevo" onclick="go('nuevo')">✍️&nbsp; Nuevo test</button>
    <button class="nav" data-v="hist" onclick="go('hist')">🗂️&nbsp; Historial</button>
    <button class="nav" data-v="banco" onclick="go('banco')">📚&nbsp; Banco</button>
    <button class="nav" data-v="sync" onclick="go('sync')">☁️&nbsp; Sincronizar</button>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main id="main"></main>
</div>
<script src="core.js"></script>
<script src="estudio.js"></script>
<script>
const $=s=>document.querySelector(s), L='ABCD';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha=i=>new Date(i).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const BC={COM:'#7c3aed',A:'#2563eb',B:'#0d9488',C:'#ea580c',D:'#db2777'};
const bcol=t=>BC[QZ.Z.mapa?.[t]]||'#64748b';
function expl(t){let x=String(t||''),tr='';const i=x.search(/Truco:/);if(i>=0){tr=x.slice(i+6).trim();x=x.slice(0,i).trim()}
  let h=esc(x).replace(/^Ampliaci[oó]n \(ha salido en el examen y no viene en los apuntes\):?\s*/,'<span class="amp">➕ Ampliación · ha salido en examen</span> ');
  return h+(tr?`<span class="truco">🪄 Truco: ${esc(tr)}</span>`:'')}
const cl=p=>p==null?'':p>=70?'good':p>=50?'mid':'bad';
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
if(matchMedia('(prefers-color-scheme:dark)').matches)document.body.classList.add('dk');

const S={view:'panel',nt:{tipo:'temas',modo:'estudio',n:20,sel:new Set()},q:null,res:null,ck:'pct',rf:'all'};

function go(v,arg){
  if(S.q&&v!=='quiz'&&!confirm('Hay un test en curso. ¿Abandonarlo sin guardar?'))return;
  if(v!=='quiz'){stopTimer();S.q=null}
  S.view=v;document.body.classList.toggle('focus',v==='quiz');
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v===v||(v==='res'&&b.dataset.v==='hist')||(v==='det'&&b.dataset.v==='hist')));
  render(arg);scrollTo(0,0);
}
async function render(arg){
  try{
    const m=$('#main');
    if(S.view==='panel')m.innerHTML=await vPanel();
    else if(S.view==='nuevo')m.innerHTML=await vNuevo();
    else if(S.view==='hist')m.innerHTML=await vHist();
    else if(S.view==='banco')m.innerHTML=await vBanco();
    else if(S.view==='sync')m.innerHTML=vSync();
    else if(S.view==='estudio')m.innerHTML=vEstudio();
    else if(S.view==='quiz')m.innerHTML=vQuiz();
    else if(S.view==='res')m.innerHTML=vRes(S.res,true);
    else if(S.view==='det'){const r=await api('sesion?i='+arg);S.res=r;m.innerHTML=vRes(r,false)}
    if(S.view==='res'||S.view==='det')renderRev();
    if(S.view==='res'&&S.res?.sesion?.apto&&!S.res._cf){S.res._cf=1;window.EST?.confeti?.()}
    if(S.view==='quiz')tick();
  }catch(e){$('#main').innerHTML=`<div class="card"><h2>No se pudo cargar</h2><p class="bad">${esc(e.message)}</p></div>`}
}

/* ---------- componentes ---------- */
const kpi=(l,v,s='',ic='',c='')=>`<div class="card kpi" style="${c?'--c:'+c:''}">${ic?`<span class="ki">${ic}</span>`:''}<div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`;
const bar=(p,c)=>`<div class="bar ${c??cl(p)}"><i style="width:${p||0}%"></i></div>`;

function chart(ses,key,apr){
  if(!ses.length)return'<div class="empty">Aún no hay intentos.<br>Haz tu primer test para ver aquí la evolución.</div>';
  const W=640,H=230,p={l:38,r:14,t:14,b:26},max=key==='pct'?100:20,iw=W-p.l-p.r,ih=H-p.t-p.b;
  const x=i=>p.l+(ses.length===1?iw/2:i*iw/(ses.length-1)),y=v=>p.t+ih*(1-Math.min(v,max)/max);
  let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bd)"/><text x="${p.l-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}
  const ref=key==='pct'?50:apr, pts=ses.map((s,i)=>[x(i),y(s[key])]), line=pts.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' ');
  const area=line+` L${pts.at(-1)[0]} ${y(0)} L${pts[0][0]} ${y(0)} Z`;
  const dots=ses.map((s,i)=>`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4.5" fill="var(--card)" stroke="var(--ac)" stroke-width="2.5" style="cursor:pointer" onclick="go('det',${s.i})"><title>${esc(s.tipo)} · ${fecha(s.fecha)}\n${s.aciertos}/${s.n} aciertos · ${s.pct}% · nota ${s.nota}</title></circle>`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}
   <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac2)" stop-opacity=".28"/><stop offset="1" stop-color="var(--ac2)" stop-opacity="0"/></linearGradient></defs>
   <line x1="${p.l}" x2="${W-p.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--mid)" stroke-dasharray="5 4"/>
   <text x="${W-p.r}" y="${y(ref)-5}" text-anchor="end" style="fill:var(--mid)">${key==='pct'?'50 %':'aprobado '+apr}</text>
   <path d="${area}" fill="url(#gr)"/><path d="${line}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
   <text x="${p.l}" y="${H-6}">intento 1</text><text x="${W-p.r}" y="${H-6}" text-anchor="end">intento ${ses.length}</text></svg>`;
}

   ${nt.tipo==='temas'?`<label class="lb">Bloques</label><div class="row">${Object.entries(info.bloques).map(([k,b])=>{const ts=con.filter(t=>t.bloque===k);const on=ts.length&&ts.every(t=>nt.sel.has(t.t));
      return`<button class="chip bqc ${on?'on':''}" style="--c:${BC[k]}" ${ts.length?'':'disabled'} onclick="selBloque('${k}')">${esc(b.nombre)} <small>${b.n}</small></button>`}).join('')}

    <label class="lb">Número de preguntas</label><div class="row">${[10,20,40,0].map(n=>`<button class="chip ${nt.n===n?'on':''}" onclick="S.nt.n=${n};render()">${n||'Todas'}</button>`).join('')}
     <input type="number" min="1" placeholder="otro" onchange="S.nt.n=+this.value||20;render()"></div>`:

async function empezar(){

let timer=null;

function tick(){
  stopTimer();const q=S.q;if(!q)return;
  const f=()=>{const el=$('#timer');if(!el)return;const t=(Date.now()-q.t0)/1000;
    if(q.limite){const r=q.limite-t;el.textContent='⏱ '+fmt(r);el.classList.toggle('warn',r<600);if(r<=0){stopTimer();toast('Se acabó el tiempo');terminar(true)}}
    else el.textContent='⏱ '+fmt(t)};
  f();timer=setInterval(f,1000);
}

  const q=S.q,p=q.qs[q.i],m=q.resp[q.i],fb=q.fb[q.i],est=q.modo==='estudio',hecho=q.resp.filter(x=>x!=null).length;

    <div class="row"><span class="badge">Pregunta ${q.i+1} de ${q.qs.length}</span><span class="badge tb" style="--c:${bcol(p.tema)}">${p.tema}</span>${p.pagina?`<span class="badge">pág. ${p.pagina}</span>`:''}<span class="sp"></span>${est&&(q.st||0)>=3?`<span class="fire">🔥 ${q.st} seguidas</span>`:''}</div>
    <div class="qtext">${esc(p.enunciado)}</div>
    ${p.ops.map((o,j)=>`<button class="opt ${cls(j)}" ${est&&fb?'disabled':''} onclick="elegir(${j})"><span class="l">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}
    ${est&&fb&&fb.explicacion?`<div class="expl">💡 ${expl(fb.explicacion)}</div>`:''}
    <div class="row" style="margin-top:20px"><button class="btn" ${q.i?'':'disabled'} onclick="ir(${q.i-1})">← Anterior</button>
     ${!est&&m!=null?'<button class="btn" onclick="elegir('+m+')">Borrar respuesta</button>':''}<span class="sp"></span>
     ${q.i<q.qs.length-1?`<button class="btn pri" onclick="ir(${q.i+1})">Siguiente →</button>`:`<button class="btn pri" onclick="terminar()">Terminar y corregir</button>`}</div>
  </div>
  <div class="card"><h2>Preguntas</h2><div class="navgrid">${q.qs.map((_,k)=>{const f=q.fb[k];let c=q.resp[k]!=null?(est&&f?(q.resp[k]===f.cor?'ok':'ko'):'ans'):'';
     return`<button class="${c} ${k===q.i?'cur':''}" onclick="ir(${k})">${k+1}</button>`}).join('')}</div>
   <button class="btn" style="width:100%;margin-top:16px" onclick="terminar()">Terminar y corregir</button>
   <button class="btn" style="width:100%;margin-top:8px" onclick="go('panel')">Abandonar</button>
   <div class="kbd"><kbd>A</kbd>–<kbd>D</kbd> responder · <kbd>←</kbd><kbd>→</kbd> moverse${est?'':' · <kbd>0</kbd> borrar'}</div></div></div>`;
}
function ir(k){const q=S.q;if(k<0||k>=q.qs.length)return;q.i=k;$('#main').innerHTML=vQuiz();tick()}
async function elegir(j){
  const q=S.q,i=q.i;if(!q)return;
  if(q.modo==='estudio'){if(q.fb[i])return;q.resp[i]=j;q.fb[i]=await api('answer',{sid:q.sid,i,marca:j});q.st=q.fb[i].cor===j?(q.st||0)+1:0;if(q.st&&q.st%5===0)window.EST?.confeti?.()}
  else q.resp[i]=q.resp[i]===j?null:j;
  if(S.q===q){$('#main').innerHTML=vQuiz();tick()}
}
async function terminar(auto){
  const q=S.q;if(!q)return;let n=q.qs.length;
  if(q.modo==='estudio'){n=q.resp.findLastIndex(x=>x!=null)+1;if(!n){toast('Aún no has respondido ninguna pregunta');return}}
  else if(!auto){const b=q.resp.filter(x=>x==null).length;if(!confirm(b?`Tienes ${b} preguntas en blanco. ¿Terminar y corregir?`:'¿Terminar y corregir?'))return}
  stopTimer();
  try{S.res=await api('finish',{sid:q.sid,respuestas:q.resp.slice(0,n)});S.q=null;S.rf=S.res.detalle.some(d=>d.marca!=null&&d.marca!==d.cor)?'ko':'all';go('res')}
  catch(e){toast(e.message);tick()}
}
addEventListener('keydown',e=>{
  if(S.view!=='quiz'||!S.q||e.ctrlKey||e.metaKey||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase(),i='abcd1234'.indexOf(k);
  if(i>=0)elegir(i%4);else if(k==='arrowright'||k==='enter')ir(S.q.i+1);else if(k==='arrowleft')ir(S.q.i-1);
  else if(k==='0'&&S.q.modo==='examen'&&S.q.resp[S.q.i]!=null)elegir(S.q.resp[S.q.i]);
});

function renderRev(){
  const det=S.res.detalle,f=S.rf;
  const cnt={all:det.length,ko:det.filter(d=>estado(d)==='ko').length,bl:det.filter(d=>estado(d)==='bl').length,ok:det.filter(d=>estado(d)==='ok').length};
  if(!det.length){$('#rev').innerHTML='<div class="empty card">Este intento viene del historial antiguo (sin detalle de preguntas).</div>';return}
  $('#rf').innerHTML=[['all','Todas'],['ko','Errores'],['bl','En blanco'],['ok','Aciertos']].map(([k,t])=>`<button class="chip ${f===k?'on':''}" onclick="S.rf='${k}';renderRev()">${t} <small>${cnt[k]}</small></button>`).join('');
  $('#rev').innerHTML=det.map((d,i)=>({d,i})).filter(({d})=>f==='all'||estado(d)===f).map(({d,i})=>`<div class="rev ${estado(d)}">
   <div class="row"><span class="badge">#${i+1}</span><span class="badge tb" style="--c:${bcol(d.tema)}">${d.tema}${d.pagina?' · pág. '+d.pagina:''}</span></div>
   <div style="font-weight:600;margin:8px 0">${esc(d.enunciado)}</div>
   ${d.ops.map((o,j)=>`<div class="o ${j===d.cor?'c':j===d.marca?'w':''}">${L[j]}) ${esc(o)}${j===d.cor?' ✓':j===d.marca?' ✗ tu respuesta':''}</div>`).join('')}
   ${d.marca==null?'<div style="color:var(--mid);margin-top:6px;font-size:13px">Sin responder</div>':''}
   ${d.expl?`<div class="expl" style="margin-top:10px">💡 ${expl(d.expl)}</div>`:''}</div>`).join('')||'<div class="empty">Nada que mostrar con este filtro.</div>';
}

/* ---------- historial ---------- */
function tablaSes(ses){
  return`<table><thead><tr><th>Fecha</th><th>Tipo</th><th class="num">Preguntas</th><th class="num">✓</th><th class="num">✗</th><th class="num">–</th><th style="width:130px">% acierto</th><th class="num">Nota</th><th class="num">Tiempo</th></tr></thead><tbody>
  ${ses.map(s=>`<tr class="click" onclick="go('det',${s.i})"><td>${fecha(s.fecha)}</td><td>${esc(s.tipo)}</td><td class="num">${s.n}</td><td class="num good">${s.aciertos}</td><td class="num bad">${s.errores}</td><td class="num">${s.blancos}</td>
   <td><div class="row" style="flex-wrap:nowrap"><div style="flex:1">${bar(s.pct)}</div><b class="${cl(s.pct)}">${Math.round(s.pct)}%</b></div></td><td class="num"><span class="badge ${s.apto?'good':'bad'}">${s.nota}</span></td><td class="num">${s.minutos??'–'} min</td></tr>`).join('')}</tbody></table>`;
}
let hf='all';
async function vHist(){
  const all=(await api('sesiones')).reverse();window._h=all;
  return`<h1>Historial</h1><p class="sub">Todos tus intentos. Pulsa uno para revisar pregunta a pregunta.</p>
  <div class="row" style="margin-bottom:14px">${[['all','Todos'],['sim','Simulacros'],['otros','Resto']].map(([k,t])=>`<button class="chip ${hf===k?'on':''}" onclick="hf='${k}';go('hist')">${t}</button>`).join('')}</div>
  <div class="card">${(()=>{const l=all.filter(s=>hf==='all'||(hf==='sim')===/simulacro/i.test(s.tipo));return l.length?tablaSes(l):'<div class="empty">No hay intentos todavía.</div>'})()}</div>`;
}

/* ---------- banco ---------- */
async function vBanco(){
  const [info,st]=await Promise.all([api('info'),api('stats')]);$('#foot').textContent=`${info.total} preguntas en el banco`;
  return`<h1>Banco de preguntas</h1><p class="sub">${info.total} preguntas válidas importadas. Para añadir o actualizar ficheros .json usa «Sincronizar».</p>
  <div class="grid g4">${Object.entries(info.bloques).map(([k,b])=>{const p=Math.min(100,Math.round(100*b.n/b.preguntas_examen));
    return`<div class="card kpi" style="--c:${BC[k]}"><div class="kl">${esc(b.nombre)}</div><div class="kv">${b.n}</div><div class="ks">${b.temas}</div><div style="margin:8px 0 4px"><div class="bar bq"><i style="width:${p}%"></i></div></div><div class="ks">${b.n<b.preguntas_examen?`faltan ≥${b.preguntas_examen-b.n} para el simulacro`:'cubre el simulacro'}</div></div>`}).join('')}</div>
  <div class="card mt"><h2>Temas</h2>${Object.keys(BC).map(bk=>`<div class="tgrp" style="--c:${BC[bk]}"><small>${esc(info.bloques[bk]?.nombre||bk)}</small><div class="tiles">${info.temas.filter(t=>t.bloque===bk).map(t=>`<button class="tile ${t.n?'has':''}" ${t.n?`onclick="practicar('${t.t}')"`:'disabled'} title="${t.t}: ${t.n} preguntas">${+t.t.slice(-2)}</button>`).join('')}</div></div>`).join('')}
   <div class="legend"><span>Cada casilla es un tema; pulsa uno con preguntas para practicarlo.</span></div></div>
  <div class="card mt"><h2>Validación</h2>${info.avisos.length?`<p class="bad">${info.avisos.length} problema(s):</p><ul>${info.avisos.slice(0,50).map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:'<p class="good">✓ Todo el banco es correcto.</p>'}</div>`;
}

QZ.ready.then(()=>go(QZ.vacio()?'sync':'panel'));
</script>
